name: Deploy on Production Environment
run-name: "${{ github.actor }} is deploying on production environment 🚀"
on:
  push:
    branches:
      - main

jobs:
  # Le SSH public de seopress (2222) est restreint par IP : les runners
  # GitHub ne peuvent pas être whitelistés. Le runner rejoint le tailnet
  # comme nœud éphémère (tag:ci) et déploie via l'adresse Tailscale du
  # serveur. SEOPRESS_SSH_HOST doit donc être l'adresse tailnet
  # (100.68.109.63 / srv1), pas l'IP publique.
  deploy-theme:
    name: "Deploy on production server (seopress)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install Composer dependencies"
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SEOPRESS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p 2222 -H "${{ secrets.SEOPRESS_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Les fichiers du thème appartiennent à nobody:nogroup ; le user de deploy
      # dispose du sudo sans mot de passe, d'où --rsync-path="sudo rsync".
      - name: Deploy theme via rsync
        run: |
          rsync -az \
            --rsync-path="sudo rsync" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.sass-cache' \
            --exclude='*.map' \
            -e "ssh -i ~/.ssh/id_deploy -p 2222" \
            ./ \
            "${{ secrets.SEOPRESS_SSH_USERNAME }}@${{ secrets.SEOPRESS_SSH_HOST }}:${{ secrets.PRODUCTION_REMOTE_PATH }}"
